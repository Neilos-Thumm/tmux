# Prefix + p for fuzzy find sessions in a popup
# bind p display-popup -E "tmux list-sessions -F '#{session_name}' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# Prefix + o to fuzzy find windows in current session (with memory)
bind o display-popup -E "tmux list-windows -F '#{?window_last_flag,0,1} #{session_name}:#{window_index} - #{window_name}' | sort -n | cut -d ' ' -f 2- | grep -v \"^$(tmux display-message -p '#S:#I')\" | fzf --reverse | cut -d ' ' -f 1 | xargs tmux select-window -t"

# Prefix + p for fuzzy find sessions in a popup (with memory)
bind p display-popup -E "tmux list-sessions -F '#{session_last_attached} #{session_name}' | sort -rn | cut -d ' ' -f 2- | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

